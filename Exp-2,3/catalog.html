<!DOCTYPE html>
<html>
<head>
    <title>Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">Product Catalog</h2>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Shoes</h5>
                    <p>₹1000</p>
                    <button class="btn btn-primary" onclick="addToCart('Shoes',1000)">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Phone</h5>
                    <p>₹15000</p>
                    <button class="btn btn-primary" onclick="addToCart('Phone',15000)">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4">
            <div class="card shadow">
                <img src="https://via.placeholder.com/300x200" class="card-img-top">
                <div class="card-body text-center">
                    <h5>T-Shirt</h5>
                    <p>₹500</p>
                    <button class="btn btn-primary" onclick="addToCart('T-Shirt',500)">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="cart.html" class="btn btn-success">Go to Cart</a>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
