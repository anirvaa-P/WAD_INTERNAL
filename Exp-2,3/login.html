<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Login</h3>

        <form onsubmit="loginUser(event)">
            <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email">
            <small class="text-danger" id="loginEmailError"></small>

            <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
            <small class="text-danger" id="loginPasswordError"></small>

            <button type="submit" class="btn btn-success w-100 mt-2">Login</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
