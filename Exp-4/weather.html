<!DOCTYPE html>
<html>
<head>
    <title>Weather App (ES6)</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-dark text-white">

<div class="container mt-5 text-center">
    <h2>🌤 Weather Graph (ES6)</h2>

    <input type="text" id="city" class="form-control w-50 mx-auto mt-3" placeholder="Enter city">
    <button onclick="getWeather()" class="btn btn-primary mt-3">Get Weather</button>

    <div class="mt-4">
        <canvas id="weatherChart"></canvas>
    </div>

    <p id="error" class="text-danger mt-3"></p>
</div>

<script src="weather.js"></script>

</body>
</html>
